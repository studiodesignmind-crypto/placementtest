<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Quest - Language Level Detector</title>
  <!-- Updated Deployment Build: Fresh Trigger -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f111a;
      --card-bg: rgba(26, 29, 45, 0.85);
      --card-border: rgba(120, 100, 255, 0.2);
      --accent-cyan: #00f2fe;
      --accent-purple: #7b2cbf;
      --accent-pink: #f72585;
      --accent-green: #38ef7d;
      --text-main: #f0f3f9;
      --text-muted: #8e9bb0;
      --font-heading: 'Fredoka', sans-serif;
      --font-body: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(123, 44, 191, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(0, 242, 254, 0.2) 0%, transparent 40%);
    }

    /* Floating Game Background Emojis */
    .bg-emoji {
      position: absolute;
      font-size: 2.5rem;
      opacity: 0.15;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    .e1 { top: 10%; left: 8%; animation-delay: 0s; }
    .e2 { top: 75%; left: 12%; animation-delay: 2s; }
    .e3 { top: 18%; right: 10%; animation-delay: 4s; }
    .e4 { top: 70%; right: 8%; animation-delay: 1s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }

    /* Progress Bar */
    .progress-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.05);
      z-index: 100;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px var(--accent-cyan);
    }

    /* Container & Slide Setup */
    .quiz-viewport {
      width: 100%;
      max-width: 680px;
      padding: 20px;
      z-index: 10;
      position: relative;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255,255,255,0.1);
      display: none;
      opacity: 0;
      transform: translateY(30px) scale(0.96);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card.active {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Header Badges & Titles */
    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(123, 44, 191, 0.3);
      border: 1px solid rgba(123, 44, 191, 0.5);
      color: var(--accent-cyan);
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 6px 16px;
      border-radius: 50px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    h1, h2 {
      font-family: var(--font-heading);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 {
      font-size: 1.4rem;
      color: var(--text-main);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* Options List */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 1.05rem;
      font-weight: 600;
      text-align: left;
      outline: none;
    }

    .option-key {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-size: 0.9rem;
      color: var(--accent-cyan);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .option-btn:hover {
      background: rgba(0, 242, 254, 0.08);
      border-color: var(--accent-cyan);
      transform: translateX(6px);
    }

    .option-btn:hover .option-key {
      background: var(--accent-cyan);
      color: var(--bg-dark);
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    .option-btn.selected {
      background: rgba(123, 44, 191, 0.25);
      border-color: var(--accent-pink);
      box-shadow: 0 0 20px rgba(247, 37, 133, 0.3);
    }

    .option-btn.selected .option-key {
      background: var(--accent-pink);
      color: #fff;
    }

    /* Action Buttons */
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border: none;
      border-radius: 16px;
      padding: 18px 32px;
      color: #fff;
      font-family: var(--font-heading);
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(0, 242, 254, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(0, 242, 254, 0.5);
    }

    /* Controls Bar */
    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .btn-nav {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 12px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-nav:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .btn-nav:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Final Result Badge Card Styling */
    .result-card {
      text-align: center;
    }

    .result-avatar {
      font-size: 4.5rem;
      margin-bottom: 16px;
      display: inline-block;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .cefr-badge {
      display: inline-block;
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: 700;
      padding: 10px 28px;
      border-radius: 50px;
      margin: 16px 0;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      box-shadow: 0 0 25px rgba(247, 37, 133, 0.4);
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <!-- Floating Background Emojis -->
  <div class="bg-emoji e1">🎮</div>
  <div class="bg-emoji e2">⚡</div>
  <div class="bg-emoji e3">⚔️</div>
  <div class="bg-emoji e4">🚀</div>

  <!-- Progress Bar -->
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <div class="quiz-viewport">

    <!-- WELCOME CARD -->
    <div class="card active" id="welcomeCard">
      <div class="card-badge">🎮 CYBER QUEST EDITION</div>
      <h1>Ready for your Language Quest? 🚀</h1>
      <p class="subtitle">Complete 20 quick interactive steps to unlock your player profile badge and discover your global skill rank!</p>
      <button class="btn-primary" onclick="startQuest()">
        START QUEST ⚡
      </button>
    </div>

    <!-- QUESTION CARDS (Generated dynamically) -->
    <div id="questionContainer"></div>

    <!-- ENDING CARD -->
    <div class="card result-card" id="endingCard">
      <div class="result-avatar" id="resAvatar">👑</div>
      <div class="card-badge" id="resBadgeTitle">QUEST COMPLETE</div>
      <h1 id="resTitle">Level Detected!</h1>
      <div class="cefr-badge" id="resCefr">CEFR B2</div>
      <p class="subtitle" id="resDesc">You are a true language legend with incredible fluency and skills!</p>
      <button class="btn-primary" onclick="restartQuest()">
        PLAY AGAIN 🔄
      </button>
    </div>

  </div>

  <script>
    // 20 Questions Dataset (CEFR A1 to C2)
    const questions = [
      { level: "A1", text: "My favorite gaming console ________ Nintendo Switch.", options: ["are", "is", "am", "be"], ans: 1 },
      { level: "A1", text: "Can you ________ a new high score in this game?", options: ["beat", "eating", "playing", "jump"], ans: 0 },
      { level: "A1", text: "There ________ three legendary swords in my inventory.", options: ["is", "am", "are", "be"], ans: 2 },
      { level: "A2", text: "Yesterday, I ________ five hours playing Minecraft with my friends.", options: ["spend", "spending", "spent", "spents"], ans: 2 },
      { level: "A2", text: "My new gaming headphones are ________ than my old broken ones.", options: ["good", "best", "more good", "better"], ans: 3 },
      { level: "A2", text: "She ________ playing online video games every afternoon.", options: ["like", "likes", "liking", "liked"], ans: 1 },
      { level: "B1", text: "If the Wi-Fi suddenly drops, we ________ lose our ranked match.", options: ["will", "would", "had", "did"], ans: 0 },
      { level: "B1", text: "Have you ever ________ a legendary mythic item in Roblox?", options: ["find", "finding", "found", "finds"], ans: 2 },
      { level: "B1", text: "While we ________ the final boss, the power went out.", options: ["fight", "are fighting", "were fighting", "fought"], ans: 2 },
      { level: "B1", text: "This is the controller ________ I bought at the store last week.", options: ["who", "what", "where", "which"], ans: 3 },
      { level: "B2", text: "The YouTube streamer suggested that everyone ________ his new video.", options: ["watched", "watches", "watch", "watching"], ans: 2 },
      { level: "B2", text: "Unless you practice your combo moves, you ________ win the tournament.", options: ["won't", "will", "can", "haven't"], ans: 0 },
      { level: "B2", text: "I wish my internet connection ________ faster when I stream.", options: ["is", "were", "has been", "will be"], ans: 1 },
      { level: "C1", text: "Hardly ________ the multiplayer match started when the server crashed.", options: ["has", "had", "did", "was"], ans: 1 },
      { level: "C1", text: "It is essential that every clan member ________ ready before the boss raid.", options: ["is", "are", "be", "were"], ans: 2 },
      { level: "C1", text: "Not only ________ finish the hardest level, but I also unlocked a secret skin.", options: ["I did", "did I", "I have", "have I"], ans: 1 },
      { level: "C2", text: "Scarcely ________ loaded the open-world map when the game froze.", options: ["I have", "had I", "did I", "was I"], ans: 1 },
      { level: "C2", text: "Should you encounter any game glitches, please ________ the developers.", options: ["notify", "notifying", "notified", "notifies"], ans: 0 },
      { level: "C2", text: "Supposing the game server ________ down, what backup plan do we have?", options: ["goes", "went", "had gone", "will go"], ans: 1 },
      { level: "C2", text: "No sooner ________ opened the chest than a trap triggered instantly.", options: ["have I", "did I", "had I", "was I"], ans: 2 }
    ];

    // CEFR Badges Mapping
    const cefrResults = {
      A1: { title: "Arcade Rookie", badge: "LEVEL A1", avatar: "🐣", desc: "You have started your journey! You understand basic terms and clear, simple game commands." },
      A2: { title: "Quest Knight", badge: "LEVEL A2", avatar: "🛡️", desc: "Great work! You handle everyday gamer dialogue and simple routines with confidence." },
      B1: { title: "Dungeon Slayer", badge: "LEVEL B1", avatar: "⚔️", desc: "Awesome job! You comfortably express main ideas on familiar gaming topics and adventures." },
      B2: { title: "Dragon Tamer", badge: "LEVEL B2", avatar: "🐲", desc: "Impressive skills! You interact fluently with complex ideas and fast-paced communication." },
      C1: { title: "Cyber Legend", badge: "LEVEL C1", avatar: "⚡", desc: "Elite mastery! You demonstrate high-level control over complex expressions and nuance." },
      C2: { title: "Master Boss", badge: "LEVEL C2", avatar: "👑", desc: "Ultimate Rank! Your language skills are legendary, precise, and completely natural." }
    };

    let currentStep = -1; // -1 = Welcome Card
    let userAnswers = new Array(questions.length).fill(null);

    // Initialize Questions into DOM
    const container = document.getElementById('questionContainer');
    questions.forEach((q, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `qCard_${idx}`;

      const keys = ['A', 'B', 'C', 'D'];
      const optionsHTML = q.options.map((opt, oIdx) => `
        <button class="option-btn" onclick="selectOption(${idx}, ${oIdx})">
          <span class="option-key">${keys[oIdx]}</span>
          <span>${opt}</span>
        </button>
      `).join('');

      card.innerHTML = `
        <div class="card-badge">STEP ${idx + 1} OF 20 🎯</div>
        <h2>${q.text}</h2>
        <div class="options-grid">${optionsHTML}</div>
        <div class="nav-controls">
          <button class="btn-nav" onclick="prevStep()" ${idx === 0 ? 'disabled' : ''}>← BACK</button>
          <span style="color: var(--text-muted); font-size: 0.85rem;">Press A, B, C, or D</span>
          <button class="btn-nav" onclick="nextStep()" id="nextBtn_${idx}">NEXT →</button>
        </div>
      `;
      container.appendChild(card);
    });

    function startQuest() {
      document.getElementById('welcomeCard').classList.remove('active');
      currentStep = 0;
      showCard(`qCard_${currentStep}`);
      updateProgress();
    }

    function showCard(cardId) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      const card = document.getElementById(cardId);
      if (card) {
        card.classList.add('active');
      }
    }

    function selectOption(qIdx, optionIdx) {
      userAnswers[qIdx] = optionIdx;
      
      const card = document.getElementById(`qCard_${qIdx}`);
      const buttons = card.querySelectorAll('.option-btn');
      buttons.forEach((btn, i) => {
        btn.classList.toggle('selected', i === optionIdx);
      });

      // Auto-advance smoothly after short delay
      setTimeout(() => {
        nextStep();
      }, 250);
    }

    function nextStep() {
      if (currentStep < questions.length - 1) {
        currentStep++;
        showCard(`qCard_${currentStep}`);
        updateProgress();
      } else if (currentStep === questions.length - 1) {
        finishQuest();
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        showCard(`qCard_${currentStep}`);
        updateProgress();
      }
    }

    function updateProgress() {
      const percentage = Math.max(0, ((currentStep + 1) / questions.length) * 100);
      document.getElementById('progressBar').style.width = `${percentage}%`;
    }

    function finishQuest() {
      document.getElementById('progressBar').style.width = '100%';
      
      // Calculate Score
      let score = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === questions[idx].ans) score++;
      });

      // Determine CEFR Level
      let levelKey = "A1";
      if (score >= 19) levelKey = "C2";
      else if (score >= 16) levelKey = "C1";
      else if (score >= 13) levelKey = "B2";
      else if (score >= 9) levelKey = "B1";
      else if (score >= 5) levelKey = "A2";

      const res = cefrResults[levelKey];
      document.getElementById('resAvatar').textContent = res.avatar;
      document.getElementById('resBadgeTitle').textContent = res.title.toUpperCase();
      document.getElementById('resCefr').textContent = res.badge;
      document.getElementById('resDesc').textContent = res.desc;

      showCard('endingCard');
      triggerConfetti();
    }

    function restartQuest() {
      currentStep = -1;
      userAnswers.fill(null);
      document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
      document.getElementById('progressBar').style.width = '0%';
      showCard('welcomeCard');
    }

    // Keyboard Shortcuts (A/B/C/D, Arrows, Enter)
    document.addEventListener('keydown', (e) => {
      if (currentStep < 0 || currentStep >= questions.length) return;

      const key = e.key.toUpperCase();
      const map = { 'A': 0, 'B': 1, 'C': 2, 'D': 3, '1': 0, '2': 1, '3': 2, '4': 3 };

      if (map[key] !== undefined) {
        selectOption(currentStep, map[key]);
      } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
        nextStep();
      } else if (e.key === 'ArrowLeft') {
        prevStep();
      }
    });

    // Simple Particle FX
    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = Array.from({ length: 70 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        color: ['#00f2fe', '#7b2cbf', '#f72585', '#38ef7d'][Math.floor(Math.random() * 4)],
        size: Math.random() * 8 + 4,
        speedY: Math.random() * 3 + 2,
        speedX: Math.random() * 2 - 1
      }));

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });
        if (particles.some(p => p.y < canvas.height)) {
          requestAnimationFrame(render);
        }
      }
      render();
    }
  </script>
</body>
</html>
